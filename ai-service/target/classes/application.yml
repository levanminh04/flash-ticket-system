spring:
  application:
    name: ai-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: false
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketbox_ai
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# LangChain4j Configuration (will be configured later)
langchain4j:
  open-ai:
    api-key: ${OPENAI_API_KEY:your-api-key-here}
    model-name: gpt-3.5-turbo
