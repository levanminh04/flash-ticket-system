server {
    listen 80;
    server_name 15.134.248.39; # Địa chỉ IP Public của EC2 bạn đang dùng

    # 1. Phục vụ Frontend ReactJS tĩnh
    location / {
        root /var/www/html/flash-ticket;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Định tuyến ngầm cho API Gateway (Chuyển tiếp cổng 80 vào API Gateway cổng 8080)
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Định tuyến ngầm cho Keycloak (Chuyển tiếp cổng 80 vào Keycloak cổng 9090)
    location /auth/ {
        proxy_pass http://localhost:9090/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Định tuyến các file tĩnh (CSS/JS/Image) của Keycloak Theme
    location /resources/ {
        proxy_pass http://localhost:9090/resources/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
