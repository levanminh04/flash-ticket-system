server:
  port: ${SERVER_PORT:8080}

spring:
  # Security - OAuth2 Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://15.134.248.39:9090/realms/flash-ticket}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://15.134.248.39:9090/realms/flash-ticket/protocol/openid-connect/certs}
  
  # Redis Configuration (for rate limiting, session storage)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}

# Eureka Client
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      coreServiceBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: count_based
      userServiceBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: count_based
      discoveryServiceBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: count_based

  timelimiter:
    instances:
      coreServiceBreaker:
        timeoutDuration: 10s
      userServiceBreaker:
        timeoutDuration: 10s
      discoveryServiceBreaker:
        timeoutDuration: 60s  # chatbot  response  hơi lâu

# Logging
logging:
  level:
    com.flashticket.gateway: ${LOG_LEVEL:DEBUG}
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:DEBUG}


#registerHealthIndicator	                    Đưa trạng thái của Circuit Breaker này vào trang /actuator/health.
#slidingWindowSize: 10	                        Theo dõi kết quả của 10 cuộc gọi gần nhất để tính toán tỷ lệ lỗi.
#minimumNumberOfCalls: 5	                    Phải có ít nhất 5 cuộc gọi (SUCC or FAIL) thì mới bắt đầu tính toán để ngắt mạch.
#failureRateThreshold: 50	                    Nếu tỉ lệ lỗi >= 50%, mạch sẽ chuyển sang trạng thái OPEN (Ngắt).
#waitDurationInOpenState: 10s	                Sau khi ngắt, nó sẽ chờ 10 giây trước khi thử chuyển sang trạng thái Half-Open.
#permittedNumberOfCallsInHalfOpenState: 3	    Ở trạng thái Half-Open, cho phép 3 cuộc gọi để kiểm tra hệ thống đã ổn định chưa.
#automaticTransitionFromOpenToHalfOpenEnabled	Tự động chuyển từ OPEN sang Half-Open mà không cần có request mới đến.
