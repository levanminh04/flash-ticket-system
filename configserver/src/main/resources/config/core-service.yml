#   resource: flash-ticket-backend
#   credentials:
#     secret: ${KEYCLOAK_CLIENT_SECRET}  # Set this in environment variables

# Logging
logging:
  level:
    com.flashticket.core: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# Cloudinary Configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}


# QR Code Signing Secret — HMAC-SHA256
app:
  qr:
    secret-key: ${QR_SECRET_KEY:flashticket-qr-secret-change-in-prod-min32chars}


