server:
  port: 8081

spring:
  # PostgreSQL Database
  datasource:
    url: jdbc:postgresql://13.239.118.235:5432/flash-ticket
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  
  # File Upload Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB        # Max size per file
      max-request-size: 10MB    # Max total request size
      file-size-threshold: 1MB  # Threshold for writing to disk
  
  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: validate  # Use Flyway for migrations
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  # Flyway Migration
  # flyway:
  #   enabled: true
  #   baseline-on-migrate: true
  #   locations: classpath:db/migration
  #   schemas: public
  
  # Redis
  data:
    redis:
      host: 13.239.118.235
      port: 6379
      timeout: 2000ms
      lettuce:  # Lettuce pool = Connection Pool cho Redis
        pool:
          max-active: 8 # tối đa 8 connection
          max-idle: 8 # tối đa 8 rảnh Nếu số connection rảnh vượt quá 8, chúng sẽ bị đóng bớt.
          min-idle: 0 # tối thiểu 0 rảnh 

  # RabbitMQ
  rabbitmq:
    host: 13.239.118.235
    port: 5672
    username: guest
    password: guest


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://13.239.118.235:9090/realms/flash-ticket


  # Kafka
  # kafka:
  #   bootstrap-servers: 13.239.118.235:9092
  #   consumer:
  #     group-id: flash-ticket-core
  #     auto-offset-reset: earliest
  #     key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  #     value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  #   producer:
  #     key-serializer: org.apache.kafka.common.serialization.StringSerializer
  #     value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Eureka Client
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Spring Security OAuth2 - Keycloak



# # Keycloak Client Config
# keycloak:
#   realm: flash-ticket
#   auth-server-url: http://13.239.118.235:9090
#   resource: flash-ticket-backend
#   credentials:
#     secret: ${KEYCLOAK_CLIENT_SECRET}  # Set this in environment variables

# Logging
logging:
  level:
    com.flashticket.core: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# Cloudinary Configuration
# IMPORTANT: Set these as environment variables, NEVER commit secrets to Git
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
