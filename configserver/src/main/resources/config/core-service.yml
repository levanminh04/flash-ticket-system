server:
  port: 8081

spring:
  # PostgreSQL Database
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  # File Upload Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB        # Max size per file
      max-request-size: 10MB    # Max total request size
      file-size-threshold: 1MB  # Threshold for writing to disk
  
  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: validate  # Use Flyway for migrations
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
  
  # Flyway Migration
  # flyway:
  #   enabled: true
  #   baseline-on-migrate: true
  #   locations: classpath:db/migration
  #   schemas: public
  
  # Redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}
      lettuce:  # Lettuce pool = Connection Pool cho Redis
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}

  # RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        # false = Nếu Consumer throw exception & NACK (not ACK) thì cho message vào DLQ mà không requeue vô tận
        default-requeue-rejected: false # DLQ (Dead Letter Queue) trong RabbitMQ là queue dùng để chứa các message bị lỗi và không thể xử lý thành công.

  # Gmail SMTP — Ticket Confirmation Email
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}        # Gmail App Password (16 ký tự, không phải mật khẩu Google)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}


  # Kafka
  # kafka:
  #   bootstrap-servers: 13.239.118.235:9092
  #   consumer:
  #     group-id: flash-ticket-core
  #     auto-offset-reset: earliest
  #     key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  #     value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  #   producer:
  #     key-serializer: org.apache.kafka.common.serialization.StringSerializer
  #     value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Eureka Client
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Spring Security OAuth2 - Keycloak



# # Keycloak Client Config
# keycloak:
#   realm: flash-ticket
