server:
  port: ${SERVER_PORT:8082}

spring:
  # MongoDB Configuration
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://13.239.118.235:27018/userdb}
      database: ${MONGO_DATABASE:userdb}
  
  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:13.239.118.235}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Eureka Client
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: "*"

# Keycloak Admin Configuration
keycloak:
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:levanminh}
    password: ${KEYCLOAK_ADMIN_PASSWORD:123456}
    server-url: ${KEYCLOAK_SERVER_URL:http://13.239.118.235:9090}
    realm: ${KEYCLOAK_REALM:flash-ticket}
    client-id: ${KEYCLOAK_CLIENT_ID:admin-cli}
    client-uid: ${KEYCLOAK_CLIENT_UID:356e5294-a49d-4370-b206-8c5d003058d0}

# Logging
logging:
  level:
    com.flashticket.user: ${LOG_LEVEL:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SECURITY:DEBUG}