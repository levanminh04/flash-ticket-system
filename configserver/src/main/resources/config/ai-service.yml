server:
  port: ${SERVER_PORT:8085}

spring:
  # PostgreSQL Database
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate  # Use 'validate' to prevent auto schema changes
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ai_schema
        format_sql: true

# Eureka Client
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: "*"

# LangChain4j Configuration (Optional - for AI features)
langchain4j:
  open-ai:
    api-key: ${OPENAI_API_KEY:}
    model-name: ${OPENAI_MODEL:gpt-3.5-turbo}

# Logging
logging:
  level:
    com.flashticket.ai: ${LOG_LEVEL:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
