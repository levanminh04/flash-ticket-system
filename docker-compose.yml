
services:
  postgres:
    container_name: postgres_flash_ticket
    image: pgvector/pgvector:pg14
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - backend
    restart: unless-stopped

  pdadmin:
    container_name: pgadmin_flash_ticket
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - backend
    restart: unless-stopped

  rabbitmq:
    container_name: rabbitmq_flash_ticket
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"      # rabbitmq message broker
      - "15672:15672"    # rabbitmq management UI (http:localhost:15672)
    networks:
      - backend
    restart: unless-stopped

  keycloak:
    container_name: keycloak-flash-ticket
    image: quay.io/keycloak/keycloak:26.0.0
    ports:
      - 9090:8080
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      
      # Integration with Custom RabbitMQ SPI
      KC_SPI_EVENTS_LISTENER_RABBITMQ_HOST: rabbitmq
      KC_SPI_EVENTS_LISTENER_RABBITMQ_PORT: 5672
      KC_SPI_EVENTS_LISTENER_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-guest}
      KC_SPI_EVENTS_LISTENER_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-guest}
      KC_SPI_EVENTS_LISTENER_RABBITMQ_EXCHANGE: keycloak.events
    networks:
      - backend
    command:
      - "start-dev"
    volumes:
      - keycloak_data:/opt/keycloak/data/
      # Mount the compiled custom SPI JAR from host to container
      - ./keycloak-rabbitmq-spi/target/keycloak-rabbitmq-spi.jar:/opt/keycloak/providers/keycloak-rabbitmq-spi.jar
    restart: unless-stopped

  mongo:
    container_name: mongodb_flash_ticket
    image: mongodb/mongodb-community-server:latest
    ports:
      - "27018:27017"
    networks:
      - backend

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper_flash_ticket
    ports:
      - 2181:2181
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - backend
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_flash_ticket
    depends_on:
      - zookeeper
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_flash_ticket
    ports:
      - "6379:6379"
    networks:
      - backend
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data


networks:
  backend:
    driver: bridge

volumes:
  postgres:
  pgadmin:
  keycloak_data:
  redis_data: